version: 2

registries:
  github-packages-tindevelopers:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.NODE_AUTH_TOKEN}}

updates:
  - package-ecosystem: "npm"
    directory: "/"
    registries:
      - github-packages-tindevelopers
    schedule:
      interval: "weekly"
      day: "monday"
    allow:
      - dependency-name: "@tindevelopers/*"
    groups:
      tindevelopers-packages:
        patterns:
          - "@tindevelopers/*"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
